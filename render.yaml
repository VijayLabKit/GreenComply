# Render Blueprint — deploys the FastAPI backend as a web service.
# Apply from the Render dashboard: New → Blueprint, pointing at this repo,
# or use these settings manually (see DEPLOY.md).
services:
  - type: web
    name: greencomply-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false          # set in the Render dashboard — never commit
      - key: SUPABASE_KEY
        sync: false          # service-role key — never commit
      - key: JWT_SECRET
        generateValue: true  # auto-generated random secret on first deploy
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: http://localhost:5173  # replace with your Vercel URL after deploy
